name: CI Check

on:
  push:

jobs:
  test:
    name: Run Unit and Functional Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Type Checks
        run: bun run check-types

      - name: Run Tests
        run: bun run test

  load-test:
    name: k6 Load Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Note: We run a build/dev process in background and wait for it.
      # You might need to adjust the command if `dev` fails in a CI environment
      # due to missing Cloudflare D1 local persistence.
      - name: Start Server Background
        run: bun run dev:server &
        
      - name: Wait for Server
        run: bunx wait-on http://localhost:3000

      - name: Run k6 Load Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load.js
        env:
          TARGET_URL: http://localhost:3000
