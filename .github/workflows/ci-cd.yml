name: CI/CD

on:
  push:
  release:
    types: [published]

jobs:
  test:
    name: Run Unit and Type Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Type Checks
        run: bun run check-types

      - name: Run Tests
        run: bun run test

  load-test:
    name: k6 Load Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Start Server in Background
        run: bun run dev:server &

      - name: Wait for Server
        run: bunx wait-on http://localhost:3000

      - name: Run k6 Load Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load.js
        env:
          TARGET_URL: http://localhost:3000

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, load-test]
    if: github.ref == 'refs/heads/develop' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Deploy to Staging (develop)
        if: github.ref == 'refs/heads/develop'
        run: bun run deploy -- --stage staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Production (release)
        if: github.event_name == 'release'
        run: bun run deploy -- --stage production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
